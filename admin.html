<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · AI Script to Video Planning Tool| Owner Ali Aslam </title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body" id="bodyEl">

  <!-- ===================== ADMIN LOGIN GATE ===================== -->
  <div class="auth-wrap" id="adminGate">
    <div class="auth-card">
      <div class="auth-header">
        <h1>🔐 Admin Access</h1>
        <p>Enter the admin password to view users</p>
      </div>
      <form id="adminLoginForm" class="auth-form" novalidate>
        <label class="auth-label" for="adminPassInput">Admin Password</label>
        <input type="password" id="adminPassInput" placeholder="Admin password" autocomplete="off" />
        <span id="adminStatus" class="status-text"></span>
        <button type="submit" class="btn btn-primary auth-submit">Unlock</button>
      </form>
    </div>
  </div>

  <!-- ===================== ADMIN PANEL (hidden until unlocked) ===================== -->
  <main class="container" id="adminPanel" style="display:none;">
    <section class="card">
      <div class="storyboard-header">
        <h2>👥 Registered Users</h2>
        <div class="button-row" style="margin-top:0;">
          <button id="refreshBtn" class="btn btn-secondary">🔄 Refresh</button>
          <a href="index.html" class="btn btn-secondary" style="text-decoration:none; display:inline-flex; align-items:center;">← Back to App</a>
        </div>
      </div>
      <p class="hint" id="userCount"></p>
      <div style="overflow-x:auto;">
        <table class="admin-table" id="usersTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Phone Number</th>
              <th>Phone Valid?</th>
              <th>Password</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    // ⚠️ Simple hardcoded gate — fine for a local demo, not real security.
    // Password is stored base64-encoded and decoded at check time
    // (still just obfuscation, not real encryption — anyone can run
    // atob() on the string below to recover it).
    const ADMIN_PASSWORD_B64 = "QXNsYW1ANzg2MDBBU1M=";
    const ADMIN_PASSWORD = atob(ADMIN_PASSWORD_B64);
    const ADMIN_SESSION_KEY = "s2v_admin_session";

    const adminGate = document.getElementById("adminGate");
    const adminPanel = document.getElementById("adminPanel");
    const bodyEl = document.getElementById("bodyEl");

    function showPanel() {
      adminGate.style.display = "none";
      adminPanel.style.display = "block";
      bodyEl.classList.remove("auth-body");
      renderUsers();
    }

    if (sessionStorage.getItem(ADMIN_SESSION_KEY) === "1") {
      showPanel();
    }

    document.getElementById("adminLoginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const val = document.getElementById("adminPassInput").value;
      const status = document.getElementById("adminStatus");
      if (val === ADMIN_PASSWORD) {
        sessionStorage.setItem(ADMIN_SESSION_KEY, "1");
        showPanel();
      } else {
        status.textContent = "❌ Wrong admin password.";
        status.className = "status-text error";
      }
    });

    function renderUsers() {
      const users = getUsers();
      const tbody = document.getElementById("usersTableBody");
      const countEl = document.getElementById("userCount");
      tbody.innerHTML = "";
      countEl.textContent = users.length + " user(s) registered.";

      if (users.length === 0) {
        const row = document.createElement("tr");
        row.innerHTML = `<td colspan="6" class="empty-text">No users signed up yet.</td>`;
        tbody.appendChild(row);
        return;
      }

      users.forEach((u, i) => {
        const valid = isValidPhoneNumber(u.number);
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${i + 1}</td>
          <td>${escapeHtmlAdmin(u.username)}</td>
          <td>${escapeHtmlAdmin(u.number)}</td>
          <td>${valid ? '<span class="status-text ok">✅ Correct</span>' : '<span class="status-text error">❌ Invalid</span>'}</td>
          <td>${escapeHtmlAdmin(u.password || "(not available)")}</td>
          <td><button class="btn btn-danger btn-small" data-number="${escapeHtmlAdmin(u.number)}">Delete</button></td>
        `;
        tbody.appendChild(row);
      });

      tbody.querySelectorAll("button[data-number]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (confirm("Delete this user?")) {
            deleteUser(btn.dataset.number);
            renderUsers();
          }
        });
      });
    }

    function escapeHtmlAdmin(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById("refreshBtn").addEventListener("click", renderUsers);
  </script>
</body>
</html>
